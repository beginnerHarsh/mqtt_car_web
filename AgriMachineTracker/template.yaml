# associated with these triggers aren't fully specified in this template and
# include placeholder values. Open this template in AWS Infrastructure Composer
# or your favorite IDE and modify it to specify a serverless application with
# other AWS resources.
#
# - SAM automatically generates permissions to interact with the resources
#   defined in this template. If your function needs additional permissions, add
#   Policies to the AWS::Serverless::Function resource.
# - [Trigger1]: Fill in an SQL statement for the IoT rule defined in your
#   specification file.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model (SAM) template describing your function.
Resources:
  AgriMachineTracker:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      CodeUri: ./src
      Description: ''
      EphemeralStorage:
        Size: 512
      Handler: lambda_function.lambda_handler
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/AgriMachineTracker
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: python3.14
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags: {}
      Timeout: 243
      Tracing: PassThrough
      Policies:
        - DynamoDBCrudPolicy:
            TableName: AgriMachine_Tracker_Data
        - DynamoDBCrudPolicy:
            TableName: AgriMachine_Stats_Summary
      Events:
        Trigger1Event:
          Type: IoTRule
          Properties:
            Sql: SELECT * FROM "AgriMachineTracker/#"

  AgriMachineTrackerDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AgriMachine_Tracker_Data
      AttributeDefinitions:
        - AttributeName: Device_ID
          AttributeType: S
        - AttributeName: Timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: Device_ID
          KeyType: HASH
        - AttributeName: Timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  AgriMachineStatsSummaryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AgriMachine_Stats_Summary
      AttributeDefinitions:
        - AttributeName: Device_ID
          AttributeType: S
      KeySchema:
        - AttributeName: Device_ID
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
